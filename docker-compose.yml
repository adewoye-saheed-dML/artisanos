services:
  postgres:
    image: postgres:16-alpine
    container_name: artisanos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artisanos}
      POSTGRES_USER: ${POSTGRES_USER:-artisanos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artisanos_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - artisanos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artisanos} -d ${POSTGRES_DB:-artisanos}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  artisanos_pgdata:

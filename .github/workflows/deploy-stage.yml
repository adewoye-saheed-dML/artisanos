name: Deploy to Staging

on:
  push:
    branches: [stage]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: CI & Deploy Staging
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: staging
      vercel_environment: preview
      vercel_prod_flag: false
    secrets: inherit
